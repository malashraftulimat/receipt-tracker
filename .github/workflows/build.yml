name: Build apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  # ---------------------------------------------------------------------------
  # Android APK
  # ---------------------------------------------------------------------------
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          ARGS=(--release)
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            ARGS+=("--dart-define=SUPABASE_URL=$SUPABASE_URL")
            ARGS+=("--dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY")
          fi
          flutter build apk "${ARGS[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Windows desktop (GitHub's windows runners have VS + Developer Mode)
  # ---------------------------------------------------------------------------
  windows:
    name: Windows desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - name: Build Windows app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          $buildArgs = @("--release")
          if ($env:SUPABASE_URL -and $env:SUPABASE_ANON_KEY) {
            $buildArgs += "--dart-define=SUPABASE_URL=$env:SUPABASE_URL"
            $buildArgs += "--dart-define=SUPABASE_ANON_KEY=$env:SUPABASE_ANON_KEY"
          }
          flutter build windows @buildArgs
      - name: Package
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath receipt_tracker-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop
          path: receipt_tracker-windows.zip
          retention-days: 30

  # ---------------------------------------------------------------------------
  # iOS — unsigned IPA (Payload/Runner.app) for Sideloadly / AltStore.
  # Sideloadly signs it with your Apple ID on Windows/macOS and installs it
  # straight to the device (no App Store, no paid developer account).
  # ---------------------------------------------------------------------------
  ios:
    name: iOS (unsigned IPA)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - name: Build without codesign
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          ARGS=(--release --no-codesign)
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            ARGS+=("--dart-define=SUPABASE_URL=$SUPABASE_URL")
            ARGS+=("--dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY")
          fi
          flutter build ios "${ARGS[@]}"

      - name: Package as unsigned IPA
        run: |
          rm -rf build/ios/ipa-payload
          mkdir -p build/ios/ipa-payload/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa-payload/Payload/
          cd build/ios/ipa-payload
          zip -qry -y ../receipt_tracker-unsigned.ipa Payload
          ls -lh ../receipt_tracker-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: build/ios/receipt_tracker-unsigned.ipa
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Web (PWA)
  # ---------------------------------------------------------------------------
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - name: Build web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          ARGS=(--release)
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            ARGS+=("--dart-define=SUPABASE_URL=$SUPABASE_URL")
            ARGS+=("--dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY")
          fi
          flutter build web "${ARGS[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web
          retention-days: 30
